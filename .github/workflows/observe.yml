name: Accept published source observations

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      regenerate_body_observation:
        description: Optional full accepted observation ID to qualify with the current renderer
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'law_history/**'
      - 'pyproject.toml'
      - '.github/scripts/ingest_public_observations.py'
      - '.github/workflows/observe.yml'

permissions:
  contents: write

concurrency:
  group: source-observation-ledger
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the independent consumer
        run: pip install .
      - name: Accept every published observation, including missed runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER: ${{ vars.SOURCE_REPOSITORY || 'sondreskarsten/norwegian-laws' }}
        run: |
          set -o pipefail
          python .github/scripts/ingest_public_observations.py --producer "$PRODUCER" \
            --report "$RUNNER_TEMP/observation-readback.json" 2>&1 | tee "$RUNNER_TEMP/observation-intake.log"
      - name: Append an explicitly requested body representation
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_body_observation != ''
        env:
          BODY_OBSERVATION: ${{ inputs.regenerate_body_observation }}
          HISTORY_REPOSITORY: ${{ github.repository }}
        run: |
          python -m law_history qualify-bodies --observation "$BODY_OBSERVATION" \
            --github-repository "$HISTORY_REPOSITORY" > "$RUNNER_TEMP/body-regeneration.json"

      - name: Publish checked observations, body and operation products, and Git receipts
        env:
          HISTORY_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git config user.name 'Norwegian laws observations'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m law_history publish --github-repository "$HISTORY_REPOSITORY" \
            --report "$RUNNER_TEMP/publication-readback.json" 2>&1 | tee "$RUNNER_TEMP/observation-publication.log"
      - name: Retain consumer readback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-readback
          path: |
            ${{ runner.temp }}/observation-readback.json
            ${{ runner.temp }}/publication-readback.json
            ${{ runner.temp }}/observation-intake.log
            ${{ runner.temp }}/observation-publication.log
            ${{ runner.temp }}/body-regeneration.json
          retention-days: 30
          if-no-files-found: warn

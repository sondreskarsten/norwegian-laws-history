name: Accept published source observations

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'law_history/**'
      - 'pyproject.toml'
      - '.github/scripts/ingest_public_observations.py'
      - '.github/workflows/observe.yml'

permissions:
  contents: write

concurrency:
  group: source-observation-ledger
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the independent consumer
        run: pip install .
      - name: Accept every published observation, including missed runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCER: ${{ vars.SOURCE_REPOSITORY || 'sondreskarsten/norwegian-laws' }}
        run: |
          python .github/scripts/ingest_public_observations.py --producer "$PRODUCER" \
            --report "$RUNNER_TEMP/observation-readback.json"
      - name: Publish checked observations, body and operation products, and Git receipts
        env:
          HISTORY_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'Norwegian laws observations'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m law_history publish --github-repository "$HISTORY_REPOSITORY" \
            --report "$RUNNER_TEMP/publication-readback.json"
      - name: Retain consumer readback report
        uses: actions/upload-artifact@v4
        with:
          name: observation-readback
          path: |
            ${{ runner.temp }}/observation-readback.json
            ${{ runner.temp }}/publication-readback.json
          retention-days: 30
          if-no-files-found: error
